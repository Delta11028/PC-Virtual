name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: "Senha para o usuário (..."
        required: true
        default: "1234"

jobs:
  id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | ...
          sudo usermod -p ... sudo runner

      - name: Instalar Servidor de Área de Trabalho e Ferramentas
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvnc...

      - name: Instalar o Ngrok
        uses: ngrok/ngrok-actions@v1
        with:
          auth-token: ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Iniciar servidor VNC
        run: |
          vncserver :1 -geometry 1280x720 -depth 24 &
          echo "iniciando na porta 5901"

          ... VNC via Ngrok (TCP)
          ngrok tcp 5901 &

      - name: Manter a Máquina Ativa
        run: |
          echo "PC Virtual pronto! Use um cliente VNC (...)
          sleep infinity
