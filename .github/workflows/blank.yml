name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Defina uma senha para o usuário (ou deixe o padrão)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Mantém a máquina ligada por até 6 horas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho e VNC
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v1
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Iniciar Servidor VNC
        run: |
          vncserver :1 -geometry 1280x720 -depth 24 &
          echo "VNC iniciado na porta 5901"

      - name: Manter a Máquina Ativa
        run: |
          echo "PC Virtual conectado via Tailscale!"
          echo "Acesse usando o IP Tailscale da máquina na porta 5901."
          sleep infinity
