name: Windows Virtual PC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          net user runner Runner#123456

      - name: Habilitar Acesso Remoto (RDP)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Instalar e Conectar ao Tailscale
        shell: powershell
        run: |
          $AUTH_KEY = "${{ secrets.TAISSCALE_AUTH_KEY }}"
          if (-not $AUTH_KEY) {
            echo "::error::A Secret TAISSCALE_AUTH_KEY nao foi encontrada!"
            exit 1
          }
          echo "Baixando e instalando Tailscale..."
          choco install tailscale -y
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$AUTH_KEY" --hostname=github-windows

      - name: Manter a Máquina Ativa e Mostrar IP
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Windows Virtual conectado com sucesso!"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600
